version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: ai_finance_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ai_finance_manager
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ai_finance_net
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_PASSWORD:-rootpassword}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Express + Prisma Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_finance_server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://root:${DB_PASSWORD:-rootpassword}@mysql:3306/ai_finance_manager
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your_super_secret_jwt_access_key_min_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_jwt_refresh_key_min_32_chars_long}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OTP_EXPIRES_IN_SECONDS: 60
      CORS_ORIGIN: http://localhost
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - '5000:5000'
    networks:
      - ai_finance_net

  # React + Vite + Nginx Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai_finance_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '80:80'
    networks:
      - ai_finance_net

volumes:
  mysql_data:
    driver: local

networks:
  ai_finance_net:
    driver: bridge
